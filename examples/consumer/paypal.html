<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayPal fixture checkout</title>
<main data-order="{{.ID}}" data-csrf="{{.CSRF}}" data-state="{{.Status}}">
<h1>PayPal fixture checkout</h1>
<p>Order {{.ID}} · {{.Price}} USD</p>
<p id="message" role="status" aria-label="Payment status" tabindex="-1">{{if eq .Status "unavailable"}}PayPal is unavailable for this checkout.{{else}}{{.Status}}{{end}}</p>
{{if ne .Status "unavailable"}}<button type="button" data-step="start" hidden>Start synthetic wallet checkout</button>
<section aria-label="Synthetic PayPal approval" hidden>
<button type="button" data-step="approve">Approve synthetic payment</button>
<button type="button" data-step="cancel">Cancel approval</button>
</section>{{end}}
</main><script src="/paypal.js" defer></script></html>
