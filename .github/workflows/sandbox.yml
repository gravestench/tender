name: Protected provider sandbox qualification

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Run one real provider test against controlled HTTPS test infrastructure'
        required: true
        type: choice
        options:
          - adyen_browser
          - adyen_portal
          - paypal_transaction
          - klarna_order
          - ach_sessions
          - ach_report

permissions:
  contents: read

concurrency:
  group: sandbox-qualification
  cancel-in-progress: false

jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    environment: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYMENTS_ENV: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
      - name: Select qualification
        shell: bash
        env:
          QUALIFICATION: ${{ inputs.qualification }}
        run: |
          set -euo pipefail
          case "$QUALIFICATION" in
            adyen_browser) pattern='^TestAdyenSandboxBrowser$' ;;
            adyen_portal) pattern='^TestAdyenSandboxPortal$' ;;
            paypal_transaction) pattern='^TestPayPalSandboxTransaction$' ;;
            klarna_order) pattern='^TestKlarnaSandboxOrderRecord$' ;;
            ach_sessions) pattern='^TestACHSandboxSessions$' ;;
            ach_report) pattern='^TestACHSandboxReport$' ;;
            *) exit 2 ;;
          esac
          printf 'TENDER_SANDBOX_PATTERN=%s\n' "$pattern" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.qualification == 'adyen_browser' || inputs.qualification == 'ach_sessions'
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser runner
        if: inputs.qualification == 'adyen_browser' || inputs.qualification == 'ach_sessions'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        if: inputs.qualification == 'adyen_browser' || inputs.qualification == 'ach_sessions'
        run: npx playwright install --with-deps chromium
      - name: Run adyen_browser
        if: inputs.qualification == 'adyen_browser'
        env:
          TENDER_ADYEN_API_KEY: ${{ secrets.TENDER_ADYEN_API_KEY }}
          TENDER_ADYEN_CLIENT_KEY: ${{ secrets.TENDER_ADYEN_CLIENT_KEY }}
          TENDER_ADYEN_MERCHANT_ACCOUNT: ${{ secrets.TENDER_ADYEN_MERCHANT_ACCOUNT }}
          TENDER_ADYEN_HMAC_KEY: ${{ secrets.TENDER_ADYEN_HMAC_KEY }}
          TENDER_ADYEN_VISA_ORIGIN: ${{ vars.TENDER_ADYEN_VISA_ORIGIN }}
          TENDER_ADYEN_MC_ORIGIN: ${{ vars.TENDER_ADYEN_MC_ORIGIN }}
          TENDER_ADYEN_VISA_CHALLENGE_TICKET: ${{ secrets.TENDER_ADYEN_VISA_CHALLENGE_TICKET }}
          TENDER_ADYEN_MC_FRICTIONLESS_TICKET: ${{ secrets.TENDER_ADYEN_MC_FRICTIONLESS_TICKET }}
          TENDER_ADYEN_MC_PURCHASE_TICKET: ${{ secrets.TENDER_ADYEN_MC_PURCHASE_TICKET }}
          TENDER_ADYEN_TEST_ACS_ORIGIN: ${{ vars.TENDER_ADYEN_TEST_ACS_ORIGIN }}
        run: go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
      - name: Run adyen_portal
        if: inputs.qualification == 'adyen_portal'
        shell: bash
        env:
          TENDER_ADYEN_MERCHANT_ACCOUNT: ${{ secrets.TENDER_ADYEN_MERCHANT_ACCOUNT }}
          TENDER_ADYEN_EVIDENCE_ORDER: ${{ secrets.TENDER_ADYEN_EVIDENCE_ORDER }}
          TENDER_CONSUMER_DATABASE_URL: ${{ secrets.TENDER_CONSUMER_DATABASE_URL }}
          TENDER_CONSUMER_SCHEMA: ${{ vars.TENDER_CONSUMER_SCHEMA }}
          TENDER_ADYEN_ACCOUNTING_CSV_B64: ${{ secrets.TENDER_ADYEN_ACCOUNTING_CSV_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$TENDER_ADYEN_ACCOUNTING_CSV_B64" ]]; then
            printf '%s' "$TENDER_ADYEN_ACCOUNTING_CSV_B64" | base64 -d > "$RUNNER_TEMP/adyen-accounting.csv"
          fi
          TENDER_ADYEN_ACCOUNTING_CSV="$RUNNER_TEMP/adyen-accounting.csv" go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
      - name: Run paypal_transaction
        if: inputs.qualification == 'paypal_transaction'
        shell: bash
        env:
          TENDER_PAYPAL_CLIENT_ID: ${{ secrets.TENDER_PAYPAL_CLIENT_ID }}
          TENDER_PAYPAL_SECRET: ${{ secrets.TENDER_PAYPAL_SECRET }}
          TENDER_PAYPAL_MERCHANT_ACCOUNT: ${{ secrets.TENDER_PAYPAL_MERCHANT_ACCOUNT }}
          TENDER_PAYPAL_WEBHOOK_ID: ${{ secrets.TENDER_PAYPAL_WEBHOOK_ID }}
          TENDER_PAYPAL_SANDBOX_PROOF_B64: ${{ secrets.TENDER_PAYPAL_SANDBOX_PROOF_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$TENDER_PAYPAL_SANDBOX_PROOF_B64" ]]; then
            printf '%s' "$TENDER_PAYPAL_SANDBOX_PROOF_B64" | base64 -d > "$RUNNER_TEMP/paypal-proof.json"
          fi
          TENDER_PAYPAL_SANDBOX_PROOF_FILE="$RUNNER_TEMP/paypal-proof.json" go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
      - name: Run klarna_order
        if: inputs.qualification == 'klarna_order'
        shell: bash
        env:
          TENDER_KLARNA_API_KEY: ${{ secrets.TENDER_KLARNA_API_KEY }}
          TENDER_KLARNA_HOST_EVIDENCE_B64: ${{ secrets.TENDER_KLARNA_HOST_EVIDENCE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$TENDER_KLARNA_HOST_EVIDENCE_B64" ]]; then
            printf '%s' "$TENDER_KLARNA_HOST_EVIDENCE_B64" | base64 -d > "$RUNNER_TEMP/klarna-host.json"
          fi
          TENDER_KLARNA_HOST_EVIDENCE="$RUNNER_TEMP/klarna-host.json" go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
      - name: Run ach_sessions
        if: inputs.qualification == 'ach_sessions'
        env:
          TENDER_ADYEN_API_KEY: ${{ secrets.TENDER_ADYEN_API_KEY }}
          TENDER_ADYEN_CLIENT_KEY: ${{ secrets.TENDER_ADYEN_CLIENT_KEY }}
          TENDER_ADYEN_MERCHANT_ACCOUNT: ${{ secrets.TENDER_ADYEN_MERCHANT_ACCOUNT }}
          TENDER_ACH_TEST_ORIGIN: ${{ vars.TENDER_ACH_TEST_ORIGIN }}
          TENDER_ACH_GIACT_ENABLED: ${{ vars.TENDER_ACH_GIACT_ENABLED }}
        run: go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
      - name: Run ach_report
        if: inputs.qualification == 'ach_report'
        shell: bash
        env:
          TENDER_ADYEN_MERCHANT_ACCOUNT: ${{ secrets.TENDER_ADYEN_MERCHANT_ACCOUNT }}
          TENDER_ACH_HOST_EVIDENCE_B64: ${{ secrets.TENDER_ACH_HOST_EVIDENCE_B64 }}
          TENDER_ACH_SETTLED_CSV_B64: ${{ secrets.TENDER_ACH_SETTLED_CSV_B64 }}
          TENDER_ACH_RETURNED_CSV_B64: ${{ secrets.TENDER_ACH_RETURNED_CSV_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$TENDER_ACH_HOST_EVIDENCE_B64" ]]; then
            printf '%s' "$TENDER_ACH_HOST_EVIDENCE_B64" | base64 -d > "$RUNNER_TEMP/ach-host.json"
          fi
          if [[ -n "$TENDER_ACH_SETTLED_CSV_B64" ]]; then
            printf '%s' "$TENDER_ACH_SETTLED_CSV_B64" | base64 -d > "$RUNNER_TEMP/ach-settled.csv"
          fi
          if [[ -n "$TENDER_ACH_RETURNED_CSV_B64" ]]; then
            printf '%s' "$TENDER_ACH_RETURNED_CSV_B64" | base64 -d > "$RUNNER_TEMP/ach-returned.csv"
          fi
          TENDER_ACH_HOST_EVIDENCE="$RUNNER_TEMP/ach-host.json" \
            TENDER_ACH_SETTLED_CSV="$RUNNER_TEMP/ach-settled.csv" \
            TENDER_ACH_RETURNED_CSV="$RUNNER_TEMP/ach-returned.csv" \
            go test -count=1 -timeout=8m -tags=sandbox ./test/sandbox/... -run "$TENDER_SANDBOX_PATTERN" -v
